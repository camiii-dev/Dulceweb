<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
</head>

<body>
    <div class="header">
        <h1>Carrito</h1>
        <a href="inicio.html">
            <button>Inicio</button>
        </a>
    </div>
    <img src="imagenes/tiramisu.jpg" alt="tiramisu">
    <h1>Tiramisú de chocolate</h1>

    <img src="imagenes/tartita.jpg" alt="tartita">

    <ul>

    <div class="hero">
        <h1>Tus datos</h1>
        <ul>
            <li>Nombre: <input type="text" name="nombre" required></li>
            <li>Apellido: <input type="text" name="apellido" required></li>
            <li>Correo electrónico: <input type="email" name="correo" required></li>
            <li>Dirección: <input type="text" name="direccion" required></li>
            <li>Teléfono: <input type="tel" name="telefono" required></li>
            <li>Provincia: <input type="text" name="provincia" required></li>
            <li>Código Postal: <input type="text" name="codigopostal" required></li>
            <li>Departamento: <input type="text" name="departamento" required></li>
            <li>Piso: <input type="number" name="piso" required></li>
            <li>Consejo: <input type="text" name="consejo" required></li>
            <li>Medio de pago: <input type="text" name="medio-pago" required></li>
        </ul>
